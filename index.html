<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Giới thiệu cá nhân | Lâm Thị Ngọc Tuyền</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #243247;
      --muted: #64748b;
      --accent: #c66b91;
      --paper: #ffffff;
      --wash: #fff0f5;
      --line: #f2dce5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #fff1f5, #fff8fa 58%, #f9edf3);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 680px);
      overflow: hidden;
      border: 1px solid rgba(242, 220, 229, .9);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(128, 70, 94, .12);
    }

    header {
      position: relative;
      padding: 42px 44px 36px;
      background: var(--wash);
      border-bottom: 1px solid var(--line);
    }


    .top-nav {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 2;
    }

    .top-nav a {
      display: inline-block;
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--accent, var(--purple));
      font-size: .9rem;
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(36, 50, 71, .08);
    }

    .top-nav a:hover { transform: translateY(-1px); }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
    }

    section {
      min-height: 150px;
      padding: 27px 30px;
      background: var(--paper);
    }

    h2 {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    section p {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.6;
    }

    footer {
      padding: 18px 30px;
      border-top: 1px solid var(--line);
      background: var(--wash);
      color: var(--muted);
      font-size: .9rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      body { padding: 24px 14px; }
      header {
      position: relative; padding: 32px 26px 28px; }
      .details { grid-template-columns: 1fr; }
      section { min-height: auto; padding: 23px 26px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <nav class="top-nav" aria-label="Điều hướng"><a href="event.html">Sự kiện</a></nav>
      <p class="eyebrow">Giới thiệu cá nhân</p>
      <h1>Lâm Thị Ngọc Tuyền</h1>
    </header>
    <div class="details">
      <section>
        <h2>Chuyên ngành</h2>
        <p>Truyền thông đa phương tiện</p>
      </section>
      <section>
        <h2>Kỹ năng</h2>
        <p>Edit, vẽ, trồng cây</p>
      </section>
      <section>
        <h2>Mục tiêu nghề nghiệp</h2>
        <p>CEO</p>
      </section>
    </div>
    <footer>Được tạo bằng Codex.</footer>
  </main>
</body>
</html>
